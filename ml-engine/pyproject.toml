[project]
name = "netwatch-ml-engine"
version = "0.1.0"
description = "NetWatch AI — ML Inference Engine"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    
    # ── Machine Learning ───────────────────────
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.38",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    
    # ── NATS ───────────────────────────────────
    "nats-py>=2.9.0",
    
    # ── Redis ──────────────────────────────────
    "redis[hiredis]>=5.2.0",
    
    # ── Utilities ──────────────────────────────
    "orjson>=3.10.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
