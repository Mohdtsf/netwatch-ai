# ══════════════════════════════════════════════
# NetWatch AI — Docker Compose (Standard Profile)
# Total RAM: ~600 MB | All features enabled
# ══════════════════════════════════════════════

services:
  # ── Message Broker ──────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: netwatch-nats
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Cache & Sessions ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    ports:
      - "6379:6379"
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netwatch-backend
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - SQLITE_DB_PATH=/app/data/netwatch.db
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/src    # dev hot-reload
      - ./coredns:/app/coredns    # CoreDNS config access
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN    # for nftables
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Packet Capture Agent ────────────────────
  capture-agent:
    build:
      context: ./capture-agent
      dockerfile: Dockerfile
    container_name: netwatch-capture
    env_file: .env
    environment:
      - NATS_URL=nats://127.0.0.1:4222
    network_mode: host    # required for raw packet capture
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
      - ./capture-agent/src:/app/src   # dev hot-reload
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # ── ML Inference Engine ─────────────────────
  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    container_name: netwatch-ml
    env_file: .env
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./ml-engine/src:/app/src   # dev hot-reload
    ports:
      - "8001:8001"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── DNS Firewall ────────────────────────────
  coredns:
    image: coredns/coredns:1.12.0
    container_name: netwatch-coredns
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8082:8082"   # health
    volumes:
      - ./coredns:/etc/coredns
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Next.js Frontend ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netwatch-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Reverse Proxy ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: netwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/certs:ro
    depends_on:
      - backend
      - frontend
    mem_limit: 32m
    restart: unless-stopped

volumes:
  nats-data:
    driver: local
